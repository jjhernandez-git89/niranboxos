# Paso final, propio de NiranBox: convierte la copia del live (que trae el
# instalador) en el sistema final de consola. Corre en el chroot del disco
# ya instalado (dontChroot: false). ${USER} lo llena Calamares con el nombre
# de usuario elegido en el paso "users".
dontChroot: false
timeout: 60
verbose: true
script:
  - command: "/usr/local/bin/niranbox-postinstall.sh ${USER}"
i18n:
  name: "Preparando la sesion de NiranBox"
