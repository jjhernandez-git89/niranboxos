# Copia el propio sistema live (el squashfs del USB, ya con Steam, gamescope,
# drivers, etc.) directo al disco de destino. install_dir="arch" en
# profiledef.sh es lo que fija esta ruta exacta.
unpack:
  - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
