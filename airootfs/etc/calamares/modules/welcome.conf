# Pantalla de bienvenida: requisitos minimos antes de dejar instalar.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 12
  requiredRam: 2.0
  internetCheckUrl: "https://archlinux.org"
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - root

geoip:
  style: "none"
