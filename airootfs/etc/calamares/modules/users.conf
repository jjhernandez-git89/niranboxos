# El resto de defaults de Calamares para este modulo ya estan bien; solo
# ampliamos los grupos para que el usuario pueda usar el mando, la GPU y el
# audio sin configurar nada (necesario para Steam/gamescope).
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - video
  - input
  - render
  - audio
  - storage
  - network
  - name: wheel
    must_exist: false
    system: true

sudoersGroup: wheel
autologinGroup: autologin
setRootPassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 1

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "niranbox"
  forbidden_names: [ localhost ]
