#
# pacman.conf para el build de la ISO (basado en el perfil releng de archiso)
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Necesario para Steam, Mesa 32-bit, gamescope-session, etc.
[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR: repo binario NO oficial (de terceros) que usamos solo para
# poder instalar `calamares` (el instalador grafico), que no existe en los
# repos oficiales de Arch. Antes de poder construir la ISO, la maquina Linux
# que compila tiene que confiar en su llave (ver build.sh, lo hace solo).
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
