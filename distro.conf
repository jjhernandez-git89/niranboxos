# Configuracion central de la distro.
# Cambia estos valores y todo el resto del perfil (ISO, splash de arranque,
# /etc/os-release, sesion de Steam) se actualiza solo.

DISTRO_NAME="NiranBox"          # nombre corto, sin espacios ni acentos (para iso_name, os-release ID)
DISTRO_PRETTY_NAME="NiranBox"   # nombre "bonito" que se muestra al usuario
DISTRO_ISO_LABEL="NIRANBOX"     # etiqueta del volumen ISO, MAYUSCULAS, sin espacios, max 32 chars
DISTRO_USER="deck"              # usuario con el que arranca la sesion de Steam

# Logos ya integrados (ver assets/):
#   - logo-blanco.png -> usado en el splash de arranque Plymouth (fondo negro)
#   - logo-negro.png  -> usado como icono/pixmap (fondo claro)
